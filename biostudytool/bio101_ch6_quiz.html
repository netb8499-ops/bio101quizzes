<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio 101 — Chapter 6 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #232328;
    --border: rgba(255,255,255,0.08);
    --text: #f0efea;
    --muted: #888780;
    --accent: #5DCAA5;
    --accent-dim: rgba(93,202,165,0.12);
    --danger: #E24B4A;
    --danger-dim: rgba(226,75,74,0.12);
    --success: #639922;
    --success-dim: rgba(99,153,34,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .container {
    width: 100%;
    max-width: 700px;
  }

  .header {
    margin-bottom: 3rem;
    text-align: center;
  }

  .header .tag {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
    display: block;
  }

  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1.15;
    color: var(--text);
  }

  .header p {
    color: var(--muted);
    margin-top: 0.5rem;
    font-size: 14px;
  }

  .progress-bar-wrap {
    background: var(--surface);
    border-radius: 999px;
    height: 4px;
    margin-bottom: 2.5rem;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .question-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 1.5rem;
  }

  .question-num {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    margin-bottom: 0.75rem;
  }

  .question-text {
    font-family: 'Syne', sans-serif;
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.45;
    margin-bottom: 1.75rem;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    background: var(--surface2);
    user-select: none;
  }

  .option:hover:not(.disabled) {
    background: rgba(93,202,165,0.06);
    border-color: rgba(93,202,165,0.3);
  }

  .option.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .option.correct {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .option.wrong {
    border-color: var(--danger);
    background: var(--danger-dim);
  }

  .option.disabled { cursor: default; }

  .option-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    font-family: 'Syne', sans-serif;
    color: var(--muted);
    transition: all 0.15s;
    margin-top: 1px;
  }

  .option.selected .option-letter,
  .option.correct .option-letter {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f1f18;
  }

  .option.wrong .option-letter {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .option-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .feedback {
    margin-top: 1.25rem;
    padding: 0.85rem 1rem;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    line-height: 1.55;
    display: none;
  }

  .feedback.correct {
    background: var(--accent-dim);
    border: 0.5px solid rgba(93,202,165,0.25);
    color: #9FE1CB;
    display: block;
  }

  .feedback.wrong {
    background: var(--danger-dim);
    border: 0.5px solid rgba(226,75,74,0.25);
    color: #F7C1C1;
    display: block;
  }

  .btn-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
    justify-content: flex-end;
  }

  button {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 0.6rem 1.4rem;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #0a1a12;
    border-color: var(--accent);
  }

  .btn-primary:hover { opacity: 0.85; }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }

  .btn-secondary:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .results {
    display: none;
    text-align: center;
    padding: 3rem 2rem;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
  }

  .results-score {
    font-family: 'Syne', sans-serif;
    font-size: 5rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .results-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .results-breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 2rem;
    text-align: left;
  }

  .breakdown-card {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 1rem 1.25rem;
  }

  .breakdown-card .num {
    font-family: 'Syne', sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text);
  }

  .breakdown-card .lbl {
    font-size: 12px;
    color: var(--muted);
  }

  .breakdown-card.good .num { color: var(--accent); }
  .breakdown-card.bad .num { color: var(--danger); }

  .result-message {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 2rem;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="tag">Bio 101</span>
    <h1>Chapter 6<br>Energy & Enzymes</h1>
    <p id="intro-sub">Test your knowledge — questions are shuffled each round</p>
  </div>

  <div id="quiz-area">
    <div class="progress-label">
      <span id="q-counter">Question 1 of 18</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
    </div>
    <div id="question-container"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="restartQuiz()">Restart</button>
      <button class="btn-primary" id="next-btn" onclick="nextQuestion()" disabled>Next</button>
    </div>
  </div>

  <div class="results" id="results-panel">
    <div class="results-score" id="final-score"></div>
    <div class="results-label">out of <span id="total-q"></span> questions</div>
    <div class="results-breakdown">
      <div class="breakdown-card good">
        <div class="num" id="correct-count"></div>
        <div class="lbl">Correct</div>
      </div>
      <div class="breakdown-card bad">
        <div class="num" id="wrong-count"></div>
        <div class="lbl">Incorrect</div>
      </div>
    </div>
    <div class="result-message" id="result-message"></div>
    <button class="btn-primary" onclick="restartQuiz()">Shuffle & Restart</button>
  </div>
</div>

<script>
const allQuestions = [
  {
    q: "What is energy?",
    options: [
      "The ability to do work or cause change",
      "The speed at which molecules move",
      "The amount of heat released in a reaction",
      "The force applied to an object"
    ],
    answer: 0,
    explanation: "Energy is simply the ability to do work or cause change. It powers everything cells do."
  },
  {
    q: "What is work, in a scientific sense?",
    options: [
      "Any effort a living organism exerts",
      "The transfer of energy that causes movement",
      "The storage of potential energy in bonds",
      "Heat released during a chemical reaction"
    ],
    answer: 1,
    explanation: "Work = Force × Distance. Movement is the key — if nothing moves, no work was done."
  },
  {
    q: "Where is chemical energy stored?",
    options: [
      "In the nucleus of an atom",
      "In the movement of electrons",
      "In the bonds between atoms in a molecule",
      "In the heat surrounding a molecule"
    ],
    answer: 2,
    explanation: "Chemical energy is stored in the bonds between atoms. Breaking those bonds releases the energy."
  },
  {
    q: "Which of the following is an example of chemical energy?",
    options: [
      "A ball rolling downhill",
      "Sunlight hitting a leaf",
      "Glucose in your bloodstream",
      "Water flowing through a pipe"
    ],
    answer: 2,
    explanation: "Glucose stores chemical energy in its bonds. Your cells extract that energy through cellular respiration."
  },
  {
    q: "What is potential energy?",
    options: [
      "Energy that is actively doing work right now",
      "Energy released as heat",
      "Stored energy waiting to be used",
      "Energy produced by movement"
    ],
    answer: 2,
    explanation: "Potential energy is stored energy. A glucose molecule sitting unused in your bloodstream is a good example."
  },
  {
    q: "What is kinetic energy?",
    options: [
      "Energy stored in chemical bonds",
      "Energy that is actively in motion or doing something",
      "Energy locked inside an ATP molecule",
      "Energy waiting to be released"
    ],
    answer: 1,
    explanation: "Kinetic energy is energy actively in motion — like a cell breaking down glucose right now."
  },
  {
    q: "In a chemical reaction, what are reactants?",
    options: [
      "The molecules that come out at the end",
      "The energy released during the reaction",
      "The molecules you start with going into the reaction",
      "The catalyst that speeds up the reaction"
    ],
    answer: 2,
    explanation: "Reactants are the ingredients that go INTO a reaction. Products are what come OUT."
  },
  {
    q: "Which best describes an exergonic reaction?",
    options: [
      "Energy must be added to make it happen",
      "Products have more energy than reactants — energy is absorbed",
      "Energy is released — products have less energy than reactants",
      "No energy change occurs"
    ],
    answer: 2,
    explanation: "Exergonic = energy exits. The products have less energy than the reactants. Breaking down glucose is exergonic."
  },
  {
    q: "Which best describes an endergonic reaction?",
    options: [
      "Energy is released and the reaction runs downhill",
      "Energy must be put in — products have more energy than reactants",
      "Heat is the main product",
      "The reaction happens spontaneously without energy input"
    ],
    answer: 1,
    explanation: "Endergonic = energy enters. You're building something more energy-rich, so you have to supply that energy. Building proteins is endergonic."
  },
  {
    q: "Why do endergonic reactions require an input of energy?",
    options: [
      "Because they release too much heat",
      "Because the catalyst needs fuel to operate",
      "Because the products contain more energy than the reactants — that extra energy must come from somewhere",
      "Because they happen too fast without an energy brake"
    ],
    answer: 2,
    explanation: "You can't create energy from nothing. If the products have more energy than the reactants, that difference has to be supplied."
  },
  {
    q: "What is activation energy?",
    options: [
      "The energy released at the end of a reaction",
      "The total energy stored in a glucose molecule",
      "The energy required to kick-start a chemical reaction",
      "The energy used by mitochondria to make ATP"
    ],
    answer: 2,
    explanation: "Activation energy is the startup cost every reaction has to pay before it can proceed — even reactions that ultimately release energy."
  },
  {
    q: "Why can't glucose energy be used directly to fuel endergonic reactions?",
    options: [
      "Glucose is too small to carry useful energy",
      "The energy release is too uncontrolled and large — it needs to be converted to ATP first",
      "Glucose only releases energy during digestion, not inside cells",
      "Endergonic reactions don't need energy from glucose"
    ],
    answer: 1,
    explanation: "Glucose energy is like a large bill — too much at once. Cells convert it into ATP, which is usable, precise energy currency."
  },
  {
    q: "ATP is often described as a 'rechargeable battery.' What makes it rechargeable?",
    options: [
      "It can absorb sunlight and regenerate",
      "It is rebuilt from ADP by adding a phosphate group back on using energy from glucose",
      "It is synthesized fresh every time from amino acids",
      "It recharges by absorbing heat from the cell"
    ],
    answer: 1,
    explanation: "When ATP breaks down it becomes ADP. The cell uses energy from glucose to add the phosphate back, rebuilding ATP. This cycle repeats constantly."
  },
  {
    q: "Where is the energy stored in an ATP molecule?",
    options: [
      "In the adenosine ring structure",
      "In the nitrogen bases",
      "In the bonds between the phosphate groups, especially the third one",
      "In the ribose sugar"
    ],
    answer: 2,
    explanation: "Breaking the bond holding the third phosphate group is what releases energy for the cell to use."
  },
  {
    q: "Is the breakdown of ATP exergonic or endergonic?",
    options: [
      "Endergonic — it requires energy to break the bond",
      "Exergonic — energy is released when the bond breaks",
      "Neither — ATP breakdown is energy-neutral",
      "It depends on the enzyme involved"
    ],
    answer: 1,
    explanation: "ATP breakdown is exergonic. Energy is released when that third phosphate bond breaks, and the cell uses that energy to do work."
  },
  {
    q: "Is the synthesis of ATP exergonic or endergonic?",
    options: [
      "Exergonic — it releases energy as it forms",
      "Endergonic — energy must be put in to build ATP from ADP",
      "Neither — it is a spontaneous reaction",
      "Exergonic because glucose powers it"
    ],
    answer: 1,
    explanation: "Building ATP (adding a phosphate back to ADP) is endergonic — it requires energy, which comes from breaking down glucose."
  },
  {
    q: "What are catalysts?",
    options: [
      "Molecules that store energy for later use",
      "Substances that slow down reactions to prevent damage",
      "Substances that speed up reactions without being consumed",
      "Proteins that carry oxygen through the blood"
    ],
    answer: 2,
    explanation: "Catalysts speed up chemical reactions and are not used up in the process — they're free to go do it again."
  },
  {
    q: "What are enzymes?",
    options: [
      "Inorganic catalysts found in rocks and soil",
      "Biological catalysts made of protein that lower activation energy",
      "Energy-storage molecules like ATP and glucose",
      "Molecules that carry oxygen in the bloodstream"
    ],
    answer: 1,
    explanation: "Enzymes are biological catalysts made of protein. They speed up specific reactions by lowering activation energy without being used up."
  },
  {
    q: "What is the active site of an enzyme?",
    options: [
      "The region where the enzyme is synthesized",
      "The part of the enzyme that stores chemical energy",
      "The specific region where the substrate binds and the reaction takes place",
      "The area of the enzyme that breaks down ATP"
    ],
    answer: 2,
    explanation: "The active site is the specific pocket on the enzyme where the substrate fits in and the reaction happens. After the reaction the enzyme is free to go again."
  },
  {
    q: "What is a substrate?",
    options: [
      "The product that comes out of an enzymatic reaction",
      "The molecule that an enzyme acts on — it binds to the active site",
      "A type of catalyst used in industrial chemistry",
      "The energy released when an enzyme works"
    ],
    answer: 1,
    explanation: "The substrate is the specific molecule the enzyme works on. It binds to the active site, the reaction happens, and then the product is released."
  }
];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function restartQuiz() {
  questions = shuffle(allQuestions);
  current = 0;
  score = 0;
  answered = false;
  document.getElementById('results-panel').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('next-btn').textContent = 'Next';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const total = questions.length;

  document.getElementById('q-counter').textContent = `Question ${current + 1} of ${total}`;
  document.getElementById('score-live').textContent = `Score: ${score}`;
  document.getElementById('progress-bar').style.width = `${(current / total) * 100}%`;
  document.getElementById('next-btn').disabled = true;

  if (current === total - 1) {
    document.getElementById('next-btn').textContent = 'See Results';
  } else {
    document.getElementById('next-btn').textContent = 'Next';
  }

  const shuffledOptions = shuffle(q.options.map((text, i) => ({ text, originalIndex: i })));

  const letters = ['A', 'B', 'C', 'D'];
  const optionsHTML = shuffledOptions.map((opt, i) => `
    <div class="option" data-original="${opt.originalIndex}" onclick="selectOption(this, ${q.answer})">
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${opt.text}</div>
    </div>
  `).join('');

  document.getElementById('question-container').innerHTML = `
    <div class="question-card">
      <div class="question-num">Question ${current + 1}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">${optionsHTML}</div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
}

function selectOption(el, correctOriginalIndex) {
  if (answered) return;
  answered = true;

  const allOptions = document.querySelectorAll('.option');
  const selectedOriginal = parseInt(el.getAttribute('data-original'));
  const isCorrect = selectedOriginal === correctOriginalIndex;

  allOptions.forEach(opt => {
    opt.classList.add('disabled');
    const orig = parseInt(opt.getAttribute('data-original'));
    if (orig === correctOriginalIndex) opt.classList.add('correct');
  });

  if (!isCorrect) {
    el.classList.add('wrong');
    el.classList.remove('correct');
  }

  if (isCorrect) score++;

  const feedback = document.getElementById('feedback');
  const q = questions[current];
  feedback.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
  feedback.textContent = (isCorrect ? '✓ Correct — ' : '✗ Not quite — ') + q.explanation;

  document.getElementById('score-live').textContent = `Score: ${score}`;
  document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
  if (!answered) return;
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-area').style.display = 'none';
  const panel = document.getElementById('results-panel');
  panel.style.display = 'block';

  const total = questions.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('final-score').textContent = `${pct}%`;
  document.getElementById('total-q').textContent = total;
  document.getElementById('correct-count').textContent = score;
  document.getElementById('wrong-count').textContent = total - score;

  let msg = '';
  if (pct === 100) msg = "Perfect score. You know this chapter cold.";
  else if (pct >= 80) msg = "Solid. Review the ones you missed and you're ready.";
  else if (pct >= 60) msg = "Getting there — a few gaps to patch before the exam.";
  else msg = "Worth another pass through the material before you quiz again.";

  document.getElementById('result-message').textContent = msg;
  document.getElementById('progress-bar').style.width = '100%';
}

restartQuiz();
</script>
</body>
</html>
