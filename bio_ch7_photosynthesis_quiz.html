<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio 101 &ndash; Chapter 7 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #232328;
    --border: rgba(255,255,255,0.08);
    --text: #f0efea;
    --muted: #888780;
    --accent: #5DCAA5;
    --accent-dim: rgba(93,202,165,0.12);
    --danger: #E24B4A;
    --danger-dim: rgba(226,75,74,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .container {
    width: 100%;
    max-width: 700px;
  }

  .header {
    margin-bottom: 3rem;
    text-align: center;
  }

  .header .tag {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
    display: block;
  }

  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1.15;
    color: var(--text);
  }

  .header p {
    color: var(--muted);
    margin-top: 0.5rem;
    font-size: 14px;
  }

  .progress-bar-wrap {
    background: var(--surface);
    border-radius: 999px;
    height: 4px;
    margin-bottom: 2.5rem;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .question-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 1.5rem;
  }

  .question-num {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    margin-bottom: 0.75rem;
  }

  .question-text {
    font-family: 'Syne', sans-serif;
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.45;
    margin-bottom: 1.75rem;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    background: var(--surface2);
    user-select: none;
  }

  .option:hover:not(.disabled) {
    background: rgba(93,202,165,0.06);
    border-color: rgba(93,202,165,0.3);
  }

  .option.correct {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .option.wrong {
    border-color: var(--danger);
    background: var(--danger-dim);
  }

  .option.disabled { cursor: default; }

  .option-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    font-family: 'Syne', sans-serif;
    color: var(--muted);
    transition: all 0.15s;
    margin-top: 1px;
  }

  .option.correct .option-letter {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f1f18;
  }

  .option.wrong .option-letter {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .option-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .feedback {
    margin-top: 1.25rem;
    padding: 0.85rem 1rem;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    line-height: 1.55;
    display: none;
  }

  .feedback.correct {
    background: var(--accent-dim);
    border: 0.5px solid rgba(93,202,165,0.25);
    color: #9FE1CB;
    display: block;
  }

  .feedback.wrong {
    background: var(--danger-dim);
    border: 0.5px solid rgba(226,75,74,0.25);
    color: #F7C1C1;
    display: block;
  }

  .btn-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
    justify-content: flex-end;
  }

  button {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 0.6rem 1.4rem;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #0a1a12;
    border-color: var(--accent);
  }

  .btn-primary:hover { opacity: 0.85; }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }

  .btn-secondary:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .results {
    display: none;
    text-align: center;
    padding: 3rem 2rem;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
  }

  .results-score {
    font-family: 'Syne', sans-serif;
    font-size: 5rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .results-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .results-breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 2rem;
    text-align: left;
  }

  .breakdown-card {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 1rem 1.25rem;
  }

  .breakdown-card .num {
    font-family: 'Syne', sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text);
  }

  .breakdown-card .lbl {
    font-size: 12px;
    color: var(--muted);
  }

  .breakdown-card.good .num { color: var(--accent); }
  .breakdown-card.bad .num { color: var(--danger); }

  .result-message {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 2rem;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="tag">Bio 101</span>
    <h1>Chapter 7<br>Photosynthesis</h1>
    <p id="intro-sub">Test your knowledge &mdash; questions are shuffled each round</p>
  </div>

  <div id="quiz-area">
    <div class="progress-label">
      <span id="q-counter">Question 1 of 13</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
    </div>
    <div id="question-container"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="restartQuiz()">Restart</button>
      <button class="btn-primary" id="next-btn" onclick="nextQuestion()" disabled>Next</button>
    </div>
  </div>

  <div class="results" id="results-panel">
    <div class="results-score" id="final-score"></div>
    <div class="results-label">out of <span id="total-q"></span> questions</div>
    <div class="results-breakdown">
      <div class="breakdown-card good">
        <div class="num" id="correct-count"></div>
        <div class="lbl">Correct</div>
      </div>
      <div class="breakdown-card bad">
        <div class="num" id="wrong-count"></div>
        <div class="lbl">Incorrect</div>
      </div>
    </div>
    <div class="result-message" id="result-message"></div>
    <button class="btn-primary" onclick="restartQuiz()">Shuffle &amp; Restart</button>
  </div>
</div>

<script>
const allQuestions = [
  {
    q: "What is photosynthesis?",
    options: [
      "The process by which plants break down glucose to release energy",
      "The process by which plants, algae, and some bacteria convert sunlight, water, and CO₂ into glucose and oxygen",
      "The process by which animals absorb nutrients from food",
      "A process that only occurs in cyanobacteria"
    ],
    answer: 1,
    explanation: "Photosynthesis converts light energy, water, and CO₂ into glucose (food for the plant) and releases oxygen as a byproduct. It is performed by plants, algae, and some bacteria."
  },
  {
    q: "What is the correct net equation for photosynthesis?",
    options: [
      "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy",
      "6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂",
      "6CO₂ + 6H₂O + light energy → C₆H₁₂O₆ + 6O₂",
      "6O₂ + C₆H₁₂O₆ + light energy → 6CO₂ + 6H₂O"
    ],
    answer: 2,
    explanation: "The net equation is: 6CO₂ + 6H₂O + light energy → C₆H₁₂O₆ + 6O₂. Six molecules each of CO₂ and water are converted into one glucose molecule and six oxygen molecules."
  },
  {
    q: "Where does a plant get the water it needs for photosynthesis?",
    options: [
      "From the air through stomata",
      "From sunlight energy",
      "Absorbed from the soil through the roots",
      "Produced internally by the plant"
    ],
    answer: 2,
    explanation: "Water is absorbed from the soil through the plant's roots and transported up to the leaves where photosynthesis takes place."
  },
  {
    q: "How does carbon dioxide enter a plant?",
    options: [
      "Through the roots from the soil",
      "Through tiny pores in the leaves called stomata",
      "Through the stem directly",
      "It is produced inside the chloroplasts"
    ],
    answer: 1,
    explanation: "CO₂ enters the plant from the air through stomata — tiny pores found mostly on the surface of leaves."
  },
  {
    q: "What are the two products of photosynthesis?",
    options: [
      "Carbon dioxide and water",
      "ATP and NADPH",
      "Glucose and oxygen",
      "Starch and carbon dioxide"
    ],
    answer: 2,
    explanation: "Photosynthesis produces glucose (used by the plant for energy) and oxygen (released into the air as a byproduct)."
  },
  {
    q: "What is the function of chloroplasts?",
    options: [
      "They store water for the plant",
      "They are the site where photosynthesis takes place",
      "They absorb minerals from the soil",
      "They control what enters and exits the cell"
    ],
    answer: 1,
    explanation: "Chloroplasts are organelles inside plant cells that are the actual site of photosynthesis. They contain the pigments and internal structures needed to carry out the process."
  },
  {
    q: "Where are chloroplasts primarily found in a plant?",
    options: [
      "In the roots",
      "In the stem only",
      "In the cells of leaves and other green parts of the plant",
      "In the flowers"
    ],
    answer: 2,
    explanation: "Chloroplasts are found mainly in the cells of leaves and other green parts of the plant, which is where most photosynthesis occurs."
  },
  {
    q: "What is a pigment?",
    options: [
      "A molecule that produces glucose",
      "A molecule that absorbs certain wavelengths of light and reflects others",
      "A structure that stores oxygen in plant cells",
      "An enzyme that speeds up photosynthesis"
    ],
    answer: 1,
    explanation: "A pigment is a molecule that absorbs some wavelengths of light and reflects others. The color you see is the wavelength being reflected back, not absorbed."
  },
  {
    q: "Why do plants appear green?",
    options: [
      "Chlorophyll absorbs green light and reflects red and blue",
      "Chlorophyll absorbs red and blue light and reflects green light",
      "Plants produce green pigment to attract insects",
      "Green is reflected by the cell walls, not by pigments"
    ],
    answer: 1,
    explanation: "Chlorophyll absorbs red and blue wavelengths of light to power photosynthesis, and reflects green light — which is why plants look green to us."
  },
  {
    q: "Where exactly is chlorophyll located inside the plant cell?",
    options: [
      "In the cell membrane",
      "In the nucleus",
      "Inside chloroplasts, embedded in membrane structures called thylakoids",
      "In the vacuole"
    ],
    answer: 2,
    explanation: "Chlorophyll is located inside chloroplasts, embedded in internal membrane structures called thylakoids. This is where light energy is captured and used."
  },
  {
    q: "Which of the following can perform photosynthesis?",
    options: [
      "Mushrooms and yeast",
      "Plants, algae, and cyanobacteria",
      "All bacteria",
      "Animals with green-tinted skin"
    ],
    answer: 1,
    explanation: "Photosynthesis is performed by plants, algae, cyanobacteria, and some other photosynthetic bacteria. These organisms are all called autotrophs — they make their own food from light."
  },
  {
    q: "What does the term 'autotroph' mean?",
    options: [
      "An organism that eats other organisms",
      "An organism that moves toward light",
      "An organism that makes its own food using light energy",
      "An organism that reproduces asexually"
    ],
    answer: 2,
    explanation: "Autotroph means ‘self-feeder.’ Autotrophs like plants can produce their own food from sunlight, water, and CO₂ without consuming other organisms."
  },
  {
    q: "How is the global carbon budget changing due to climate change?",
    options: [
      "CO₂ is being absorbed faster than it is released, so levels are dropping",
      "Fossil fuel burning and deforestation are causing CO₂ to accumulate faster than it can be absorbed",
      "The carbon budget is balanced because plants absorb all extra CO₂",
      "Climate change has no measurable effect on atmospheric CO₂ levels"
    ],
    answer: 1,
    explanation: "Burning fossil fuels releases CO₂ that was locked underground for millions of years. Deforestation removes trees that would absorb it. Oceans and forests can’t keep up, so CO₂ keeps rising, trapping heat and driving climate change."
  }
];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function restartQuiz() {
  questions = shuffle(allQuestions);
  current = 0;
  score = 0;
  answered = false;
  document.getElementById('results-panel').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('next-btn').textContent = 'Next';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const total = questions.length;

  document.getElementById('q-counter').textContent = `Question ${current + 1} of ${total}`;
  document.getElementById('score-live').textContent = `Score: ${score}`;
  document.getElementById('progress-bar').style.width = `${(current / total) * 100}%`;
  document.getElementById('next-btn').disabled = true;

  if (current === total - 1) {
    document.getElementById('next-btn').textContent = 'See Results';
  } else {
    document.getElementById('next-btn').textContent = 'Next';
  }

  const shuffledOptions = shuffle(q.options.map((text, i) => ({ text, originalIndex: i })));
  const letters = ['A', 'B', 'C', 'D'];
  const optionsHTML = shuffledOptions.map((opt, i) => `
    <div class="option" data-original="${opt.originalIndex}" onclick="selectOption(this, ${q.answer})">
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${opt.text}</div>
    </div>
  `).join('');

  document.getElementById('question-container').innerHTML = `
    <div class="question-card">
      <div class="question-num">Question ${current + 1}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">${optionsHTML}</div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
}

function selectOption(el, correctOriginalIndex) {
  if (answered) return;
  answered = true;

  const allOptions = document.querySelectorAll('.option');
  const selectedOriginal = parseInt(el.getAttribute('data-original'));
  const isCorrect = selectedOriginal === correctOriginalIndex;

  allOptions.forEach(opt => {
    opt.classList.add('disabled');
    const orig = parseInt(opt.getAttribute('data-original'));
    if (orig === correctOriginalIndex) opt.classList.add('correct');
  });

  if (!isCorrect) {
    el.classList.add('wrong');
    el.classList.remove('correct');
  }

  if (isCorrect) score++;

  const feedback = document.getElementById('feedback');
  const q = questions[current];
  feedback.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
  feedback.textContent = (isCorrect ? '✓ Correct — ' : '✗ Not quite — ') + q.explanation;

  document.getElementById('score-live').textContent = `Score: ${score}`;
  document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
  if (!answered) return;
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-area').style.display = 'none';
  const panel = document.getElementById('results-panel');
  panel.style.display = 'block';

  const total = questions.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('final-score').textContent = `${pct}%`;
  document.getElementById('total-q').textContent = total;
  document.getElementById('correct-count').textContent = score;
  document.getElementById('wrong-count').textContent = total - score;

  let msg = '';
  if (pct === 100) msg = "Perfect score. You know this chapter cold.";
  else if (pct >= 80) msg = "Solid. Review the ones you missed and you're ready.";
  else if (pct >= 60) msg = "Getting there — a few gaps to patch before the exam.";
  else msg = "Worth another pass through the material before you quiz again.";

  document.getElementById('result-message').textContent = msg;
  document.getElementById('progress-bar').style.width = '100%';
}

restartQuiz();
</script>
</body>
</html>
