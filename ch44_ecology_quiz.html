<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio 101 &ndash; Chapter 44 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #232328;
    --border: rgba(255,255,255,0.08);
    --text: #f0efea;
    --muted: #888780;
    --accent: #5DCAA5;
    --accent-dim: rgba(93,202,165,0.12);
    --danger: #E24B4A;
    --danger-dim: rgba(226,75,74,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .container {
    width: 100%;
    max-width: 700px;
  }

  .header {
    margin-bottom: 3rem;
    text-align: center;
  }

  .header .tag {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
    display: block;
  }

  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1.15;
    color: var(--text);
  }

  .header p {
    color: var(--muted);
    margin-top: 0.5rem;
    font-size: 14px;
  }

  .progress-bar-wrap {
    background: var(--surface);
    border-radius: 999px;
    height: 4px;
    margin-bottom: 2.5rem;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .question-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 1.5rem;
  }

  .question-num {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    margin-bottom: 0.75rem;
  }

  .question-text {
    font-family: 'Syne', sans-serif;
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.45;
    margin-bottom: 1.75rem;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    background: var(--surface2);
    user-select: none;
  }

  .option:hover:not(.disabled) {
    background: rgba(93,202,165,0.06);
    border-color: rgba(93,202,165,0.3);
  }

  .option.correct {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .option.wrong {
    border-color: var(--danger);
    background: var(--danger-dim);
  }

  .option.disabled { cursor: default; }

  .option-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    font-family: 'Syne', sans-serif;
    color: var(--muted);
    transition: all 0.15s;
    margin-top: 1px;
  }

  .option.correct .option-letter {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f1f18;
  }

  .option.wrong .option-letter {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .option-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .feedback {
    margin-top: 1.25rem;
    padding: 0.85rem 1rem;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    line-height: 1.55;
    display: none;
  }

  .feedback.correct {
    background: var(--accent-dim);
    border: 0.5px solid rgba(93,202,165,0.25);
    color: #9FE1CB;
    display: block;
  }

  .feedback.wrong {
    background: var(--danger-dim);
    border: 0.5px solid rgba(226,75,74,0.25);
    color: #F7C1C1;
    display: block;
  }

  .btn-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
    justify-content: flex-end;
  }

  button {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 0.6rem 1.4rem;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #0a1a12;
    border-color: var(--accent);
  }

  .btn-primary:hover { opacity: 0.85; }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }

  .btn-secondary:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .results {
    display: none;
    text-align: center;
    padding: 3rem 2rem;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
  }

  .results-score {
    font-family: 'Syne', sans-serif;
    font-size: 5rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .results-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .results-breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 2rem;
    text-align: left;
  }

  .breakdown-card {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 1rem 1.25rem;
  }

  .breakdown-card .num {
    font-family: 'Syne', sans-serif;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text);
  }

  .breakdown-card .lbl {
    font-size: 12px;
    color: var(--muted);
  }

  .breakdown-card.good .num { color: var(--accent); }
  .breakdown-card.bad .num { color: var(--danger); }

  .result-message {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 2rem;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="tag">Bio 101</span>
    <h1>Chapter 44<br>Ecology &amp; Climate</h1>
    <p id="intro-sub">Test your knowledge &mdash; questions are shuffled each round</p>
  </div>

  <div id="quiz-area">
    <div class="progress-label">
      <span id="q-counter">Question 1 of 32</span>
      <span id="score-live">Score: 0</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
    </div>
    <div id="question-container"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="restartQuiz()">Restart</button>
      <button class="btn-primary" id="next-btn" onclick="nextQuestion()" disabled>Next</button>
    </div>
  </div>

  <div class="results" id="results-panel">
    <div class="results-score" id="final-score"></div>
    <div class="results-label">out of <span id="total-q"></span> questions</div>
    <div class="results-breakdown">
      <div class="breakdown-card good">
        <div class="num" id="correct-count"></div>
        <div class="lbl">Correct</div>
      </div>
      <div class="breakdown-card bad">
        <div class="num" id="wrong-count"></div>
        <div class="lbl">Incorrect</div>
      </div>
    </div>
    <div class="result-message" id="result-message"></div>
    <button class="btn-primary" onclick="restartQuiz()">Shuffle &amp; Restart</button>
  </div>
</div>

<script>
const allQuestions = [
  {
    q: "What is the correct order of biological organization from smallest to largest?",
    options: [
      "Organism → Population → Ecosystem → Community → Biosphere",
      "Population → Organism → Community → Biosphere → Ecosystem",
      "Organism → Population → Community → Ecosystem → Biosphere",
      "Community → Population → Organism → Ecosystem → Biosphere"
    ],
    answer: 2,
    explanation: "It goes Organism (one individual) → Population (same species, same area) → Community (multiple species) → Ecosystem (community + nonliving stuff) → Biosphere (all ecosystems on Earth)."
  },
  {
    q: "What is a Population in ecology?",
    options: [
      "Multiple different species interacting in the same area",
      "A group of the same species living in the same area",
      "All the non-living components of an environment",
      "Every ecosystem on Earth combined"
    ],
    answer: 1,
    explanation: "Population = same species, same place. All the salmon in a river is a population. Mix in the bears and trees and it becomes a community."
  },
  {
    q: "What distinguishes an Ecosystem from a Community?",
    options: [
      "An ecosystem includes only living things; a community includes living and nonliving things",
      "A community is bigger than an ecosystem",
      "An ecosystem includes the community PLUS all the non-living components like water, soil, and sunlight",
      "They are the same thing described at different scales"
    ],
    answer: 2,
    explanation: "Community = just the organisms. Add the abiotic stuff (soil, water, sunlight, temperature) and you have an ecosystem."
  },
  {
    q: "What is the Biosphere?",
    options: [
      "A single ecosystem with extremely high biodiversity",
      "The layer of atmosphere that blocks UV radiation",
      "The community of organisms in the ocean",
      "Every ecosystem on Earth combined — the entire living layer of the planet"
    ],
    answer: 3,
    explanation: "Biosphere is the biggest level — it's all life on Earth, everywhere, in every ecosystem combined."
  },
  {
    q: "Which of the following is an ABIOTIC factor?",
    options: [
      "Bacteria in the soil",
      "Dead leaves on the forest floor",
      "Soil salinity and temperature",
      "Fungi breaking down a log"
    ],
    answer: 2,
    explanation: "Abiotic = non-living physical/chemical stuff. Salinity and temperature are chemical/physical — no life involved. Bacteria, dead leaves, and fungi are all biotic (living or from living things)."
  },
  {
    q: "Which of the following is a BIOTIC factor?",
    options: [
      "Wind speed",
      "Rock composition",
      "Water pH",
      "Poop from an animal"
    ],
    answer: 3,
    explanation: "Biotic = living things OR things that came FROM living things. Poop came from an animal — it's biotic. Wind, rock, and pH are all nonliving = abiotic."
  },
  {
    q: "How do biotic and abiotic factors relate to each other?",
    options: [
      "They operate independently and rarely influence each other",
      "Abiotic factors depend on biotic factors but not the other way around",
      "They constantly affect each other — for example, no sunlight (abiotic) means no plants (biotic) means no animals",
      "Biotic factors only matter in terrestrial ecosystems, abiotic only in aquatic ones"
    ],
    answer: 2,
    explanation: "They are deeply interconnected. Abiotic conditions determine what can live somewhere, and living things alter their abiotic environment in return."
  },
  {
    q: "What is Ocean Upwelling and why does it matter ecologically?",
    options: [
      "Warm surface water sinking to the bottom, distributing oxygen to deep sea creatures",
      "Cold, deep nutrient-rich water getting pushed to the surface by wind, fueling massive phytoplankton blooms",
      "The process by which ocean currents carry nutrients from the equator to the poles",
      "The movement of salt water into freshwater estuaries during high tide"
    ],
    answer: 1,
    explanation: "Dead stuff sinks and decomposes at depth, loading deep water with nutrients. Wind pushes that water up, feeding phytoplankton — the base of the ocean food web. No upwelling = dead zone."
  },
  {
    q: "Why does warmer ocean water pose a problem for marine life?",
    options: [
      "Warm water has higher salinity, which most marine species cannot tolerate",
      "Warm water holds LESS dissolved oxygen, threatening species that need oxygen-rich water",
      "Warm water causes nutrients to sink faster, starving surface organisms",
      "Warm water increases UV penetration, damaging marine organisms"
    ],
    answer: 1,
    explanation: "Warm water = less dissolved oxygen. Cold water holds more. This directly impacts what species can survive and how fast decomposition and nutrient cycling happen."
  },
  {
    q: "What role does FIRE play in nutrient cycling?",
    options: [
      "Fire destroys all nutrients permanently, resetting ecosystems to zero",
      "Fire locks nutrients into charcoal where they stay for centuries",
      "Fire rapidly releases nutrients stored in plant material back into the soil, which is why burned areas often bloom with new growth",
      "Fire only affects nutrient cycling in tropical ecosystems"
    ],
    answer: 2,
    explanation: "Plants lock nutrients up in their tissues. Fire is basically a fast-forward button — it releases those nutrients straight into the soil, which is why post-fire landscapes can be surprisingly productive."
  },
  {
    q: "What is Net Primary Productivity (NPP)?",
    options: [
      "The total amount of sunlight captured by all plants in an ecosystem per year",
      "The total energy producers create through photosynthesis MINUS what they use just to keep themselves alive",
      "The total biomass of all organisms in an ecosystem",
      "The rate at which decomposers break down dead organic material"
    ],
    answer: 1,
    explanation: "NPP = gross photosynthesis minus the plant's own respiration costs. It's the NET new organic material actually added to the ecosystem each year — the energy available for everyone else."
  },
  {
    q: "Which biome has the HIGHEST Net Primary Productivity?",
    options: [
      "Temperate deciduous forest",
      "Savanna",
      "Tundra",
      "Tropical rainforest"
    ],
    answer: 3,
    explanation: "Tropical rainforests get tons of sunlight, warmth, and rainfall year-round — all the things that maximize photosynthesis. Highest NPP on land. Deserts and tundra are at the bottom."
  },
  {
    q: "Which of the following is NOT a factor that affects Net Primary Productivity?",
    options: [
      "Sunlight availability",
      "Soil nitrogen and phosphorus levels",
      "The number of predators in the ecosystem",
      "Water availability"
    ],
    answer: 2,
    explanation: "NPP is about what PRODUCERS can make. Predator counts don't directly affect how much photosynthesis plants can do. Sunlight, water, nutrients, temperature, and CO2 are the key drivers."
  },
  {
    q: "What are Primary Producers and why are they essential?",
    options: [
      "Animals that eat plants and convert plant energy into animal biomass",
      "Decomposers that break down dead organic matter and return nutrients to the soil",
      "Organisms that make their own food from sunlight or chemicals — they are the foundation of every food web",
      "Top predators that control population sizes of all other organisms"
    ],
    answer: 2,
    explanation: "Producers (plants, algae, phytoplankton, cyanobacteria) capture energy from sunlight and convert it into organic matter. Everything else eats them, directly or indirectly. No producers = no ecosystem."
  },
  {
    q: "What defines a BIOME?",
    options: [
      "A region defined by its dominant animal species",
      "A large region of Earth defined by its climate and the characteristic plants and animals that live there",
      "Any area that receives more than 100cm of rain per year",
      "An ecosystem that spans more than one continent"
    ],
    answer: 1,
    explanation: "Biomes are defined by CLIMATE — primarily temperature and precipitation — not by specific species. Same climate across different continents = different species but same biome type."
  },
  {
    q: "Which terrestrial biome is characterized by hot, wet conditions year-round and the highest biodiversity on Earth?",
    options: [
      "Temperate deciduous forest",
      "Savanna",
      "Tropical rainforest",
      "Taiga"
    ],
    answer: 2,
    explanation: "Tropical rainforest: hot, wet, all year. Maximum growing conditions = maximum biodiversity. Also has the highest NPP of any terrestrial biome."
  },
  {
    q: "What distinguishes the Taiga (Boreal Forest) from the Tundra?",
    options: [
      "Taiga is hotter and drier; tundra is cold and wet",
      "Taiga has conifer trees and long cold winters; tundra is even colder with no trees and permafrost underground",
      "Taiga is found only in North America; tundra is found only in Europe",
      "Taiga has permafrost; tundra does not"
    ],
    answer: 1,
    explanation: "Taiga = cold, conifer trees (spruce, fir, pine), long winters. Tundra = too cold even for trees, permafrost (permanently frozen ground below surface). Tundra is more extreme."
  },
  {
    q: "An estuary is best described as:",
    options: [
      "A deep-ocean zone with very low light and productivity",
      "The shoreline zone exposed at low tide with highly variable conditions",
      "Where a river meets the ocean — high in nutrients, and serves as critical nursery habitat for many species",
      "A shallow coral ecosystem in warm tropical waters"
    ],
    answer: 2,
    explanation: "Estuaries sit at the junction of fresh and salt water. Nutrients pour in from rivers, making them incredibly productive. They're nurseries for huge numbers of fish and invertebrate species."
  },
  {
    q: "Which aquatic biome is described as shallow, warm, and insanely biodiverse?",
    options: [
      "Open ocean (pelagic zone)",
      "Freshwater lakes",
      "Intertidal zone",
      "Coral reef"
    ],
    answer: 3,
    explanation: "Coral reefs are sometimes called the 'rainforests of the sea.' Shallow, warm, tons of structure for habitat — they host a huge fraction of all marine species despite covering a small area."
  },
  {
    q: "What two climate factors most strongly determine which biome exists in a region?",
    options: [
      "Soil type and elevation",
      "Altitude and proximity to the ocean",
      "Temperature and precipitation",
      "Wind patterns and ocean currents"
    ],
    answer: 2,
    explanation: "Temperature and precipitation are the two big drivers of biome type. They determine what plants can grow, which determines everything else."
  },
  {
    q: "What is the difference between weather and climate?",
    options: [
      "Weather is measured over decades; climate changes day to day",
      "Weather is what's happening in the atmosphere right now or short-term; climate is the long-term pattern of weather in a region over decades",
      "Weather describes ocean conditions; climate describes atmospheric conditions",
      "They describe the same thing but at different geographic scales"
    ],
    answer: 1,
    explanation: "Weather = right now (it's raining today). Climate = the long-term pattern (Portland is generally rainy and mild). One useful analogy: weather is your mood, climate is your personality."
  },
  {
    q: "How does the Greenhouse Effect work?",
    options: [
      "The ozone layer reflects incoming solar radiation, keeping Earth from overheating",
      "Greenhouse gases in the atmosphere absorb incoming solar radiation before it reaches Earth's surface",
      "The sun sends energy to Earth, Earth radiates it back as heat, and greenhouse gases trap some of that outgoing heat — keeping Earth warm",
      "Polar ice caps reflect sunlight back into space, regulating global temperature"
    ],
    answer: 2,
    explanation: "It's a one-two: sun heats Earth, Earth radiates heat back out, greenhouse gases (CO2, methane, water vapor) catch some of that outgoing heat. The problem is we're adding MORE greenhouse gases, trapping MORE heat."
  },
  {
    q: "Which of the following is NOT listed as evidence of global climate change?",
    options: [
      "Rising average global temperatures since the industrial revolution",
      "Species shifting their ranges toward the poles or higher elevations",
      "A significant increase in global average wind speed",
      "Melting glaciers and rising sea levels"
    ],
    answer: 2,
    explanation: "Global average wind speed increase is not a listed piece of climate change evidence. Rising temps, melting ice, rising seas, ocean acidification, earlier spring blooms, and range shifts are all documented evidence."
  },
  {
    q: "Why do melting glaciers AND warmer water BOTH contribute to rising sea levels?",
    options: [
      "Glaciers add salt to the ocean which makes water denser and take up less space",
      "Melting ice adds water volume directly, and warmer water physically expands — two separate mechanisms both raising sea levels",
      "Warmer water evaporates faster, but glacier melt more than compensates for this",
      "Both processes increase ocean salinity, which raises sea level"
    ],
    answer: 1,
    explanation: "Two mechanisms: (1) melting ice physically adds more water to the ocean, and (2) water expands as it warms (thermal expansion). Both push sea levels up."
  },
  {
    q: "Which human activity is the LARGEST source of CO2 emissions?",
    options: [
      "Livestock farming",
      "Landfills and waste decomposition",
      "Burning fossil fuels (coal, oil, natural gas) for energy and transportation",
      "Rice paddy farming"
    ],
    answer: 2,
    explanation: "Burning fossil fuels dominates CO2 emissions. Deforestation is second. Livestock and landfills are primarily methane sources, not CO2."
  },
  {
    q: "Which of the following is a major source of METHANE emissions?",
    options: [
      "Burning coal for electricity",
      "Cement production",
      "Livestock farming (cows produce methane through digestion)",
      "Cutting down forests"
    ],
    answer: 2,
    explanation: "Cows and other livestock release methane through their digestive process. Landfills, rice paddies, and natural gas leaks are also major methane sources. CO2 comes from burning fossil fuels and deforestation."
  },
  {
    q: "Why does deforestation contribute to CO2 emissions?",
    options: [
      "Trees release CO2 through photosynthesis when they are alive",
      "Trees store carbon; when they are burned or cut down, that stored carbon is released as CO2",
      "Deforestation exposes soil, which releases methane into the atmosphere",
      "Removing trees increases wind speed, which stirs up carbon stored in the ocean"
    ],
    answer: 1,
    explanation: "Trees are living carbon storage. While alive they pull CO2 OUT of the atmosphere. Cut or burn them and all that stored carbon gets released back as CO2."
  },
  {
    q: "What is coral bleaching and what causes it?",
    options: [
      "Coral turns white due to increased UV radiation passing through the depleted ozone layer",
      "Coral expels the symbiotic algae living in its tissue when water gets too warm, leaving it white and at risk of dying",
      "Coral absorbs excess CO2, which reacts with its calcium structure to produce a white compound",
      "Coral bleaches when sea levels rise and sunlight can no longer reach it"
    ],
    answer: 1,
    explanation: "Coral and algae (zooxanthellae) have a symbiotic relationship — the algae feed the coral and give it color. Too-warm water stresses coral and it kicks the algae out, turning white. Without the algae it slowly starves."
  },
  {
    q: "How does global warming affect biodiversity beyond just killing species directly?",
    options: [
      "It has no effect on biodiversity as long as total species count stays the same",
      "It primarily reduces biodiversity in tropical regions while increasing it near the poles",
      "It creates timing mismatches — for example, flowers blooming before pollinators arrive — disrupting ecological relationships even when species survive",
      "It only affects marine biodiversity, not terrestrial ecosystems"
    ],
    answer: 2,
    explanation: "Even if a species doesn't go extinct directly, warming shifts timing of seasonal events. If flowers bloom two weeks early but bees haven't emerged yet, both the plant and the pollinator lose out. These mismatches cascade through food webs."
  },
  {
    q: "What happens to freshwater supply when glaciers melt?",
    options: [
      "Freshwater supply increases permanently as ice water is released into rivers",
      "Freshwater supply is unaffected since glacier water flows to the ocean",
      "In the long run, freshwater supply decreases because millions of people and animals depend on glacial meltwater as a reliable seasonal water source — once gone, it's gone",
      "Glacial melt only affects saltwater ecosystems, not freshwater supplies"
    ],
    answer: 2,
    explanation: "Many rivers (especially in Asia and South America) are fed by glacial melt. Short term there's more water, but long term when the glacier is gone, that seasonal water source disappears permanently."
  },
  {
    q: "At the individual level, which action has one of the largest impacts on reducing your carbon footprint?",
    options: [
      "Switching to LED light bulbs",
      "Reducing meat consumption, especially beef",
      "Recycling plastic bottles",
      "Unplugging electronics when not in use"
    ],
    answer: 1,
    explanation: "Beef production is enormously carbon-intensive — land use, methane from cattle, feed crops, transportation. Reducing meat (especially beef) is one of the highest-impact individual choices. LEDs and unplugging electronics matter but are much smaller."
  },
  {
    q: "Why does the study guide say that individual actions alone are insufficient to solve climate change?",
    options: [
      "Because individuals do not produce any meaningful carbon emissions",
      "Because individual choices are too unpredictable to model",
      "Because individual actions are small compared to systemic industrial and governmental emissions — both personal and systemic change are needed",
      "Because individual behavior changes always reverse within a few years"
    ],
    answer: 2,
    explanation: "Your personal footprint matters but it's a drop in the bucket compared to industrial and energy systems. That's why voting for climate policy, supporting renewables, and pushing for carbon pricing matters as much or more."
  },
  {
    q: "Which of the following is a 'bigger picture' climate solution rather than an individual-level one?",
    options: [
      "Flying less frequently",
      "Buying fewer consumer products",
      "Implementing carbon taxes or cap-and-trade systems at a government level",
      "Using LED light bulbs at home"
    ],
    answer: 2,
    explanation: "Carbon taxes and cap-and-trade are policy tools that change incentives for entire industries and economies — that's systemic change. Flying less, buying less, and LED bulbs are personal choices."
  },
  {
    q: "Tropical rainforests have the highest NPP AND the highest biodiversity. What single factor best explains both of these?",
    options: [
      "Large geographic size covering multiple continents",
      "Ancient soils that have accumulated nutrients for millions of years",
      "Year-round warmth, sunlight, and high rainfall creating ideal conditions for continuous plant growth",
      "Low predator pressure allowing more species to coexist"
    ],
    answer: 2,
    explanation: "Consistent warmth, light, and water = nonstop growing season = maximum photosynthesis = maximum energy available = maximum number of species the ecosystem can support. It all flows from those physical conditions."
  },
  {
    q: "If ocean temperatures rise significantly due to climate change, what chain of effects would most directly follow?",
    options: [
      "Higher oxygen levels → more fish → more productive fisheries",
      "Less dissolved oxygen + coral bleaching → collapse of reef ecosystems → loss of marine biodiversity",
      "More evaporation → more rainfall inland → higher terrestrial NPP globally",
      "Warmer water increases upwelling → more phytoplankton → more fish"
    ],
    answer: 1,
    explanation: "Warmer water holds less oxygen AND stresses coral (causing bleaching). Reefs are biodiversity hotspots — their collapse means massive loss of marine species and the ecosystems they support."
  }
];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function restartQuiz() {
  questions = shuffle(allQuestions);
  current = 0;
  score = 0;
  answered = false;
  document.getElementById('results-panel').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('next-btn').textContent = 'Next';
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const total = questions.length;

  document.getElementById('q-counter').textContent = `Question ${current + 1} of ${total}`;
  document.getElementById('score-live').textContent = `Score: ${score}`;
  document.getElementById('progress-bar').style.width = `${(current / total) * 100}%`;
  document.getElementById('next-btn').disabled = true;

  if (current === total - 1) {
    document.getElementById('next-btn').textContent = 'See Results';
  } else {
    document.getElementById('next-btn').textContent = 'Next';
  }

  const shuffledOptions = shuffle(q.options.map((text, i) => ({ text, originalIndex: i })));
  const letters = ['A', 'B', 'C', 'D'];
  const optionsHTML = shuffledOptions.map((opt, i) => `
    <div class="option" data-original="${opt.originalIndex}" onclick="selectOption(this, ${q.answer})">
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${opt.text}</div>
    </div>
  `).join('');

  document.getElementById('question-container').innerHTML = `
    <div class="question-card">
      <div class="question-num">Question ${current + 1}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">${optionsHTML}</div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
}

function selectOption(el, correctOriginalIndex) {
  if (answered) return;
  answered = true;

  const allOptions = document.querySelectorAll('.option');
  const selectedOriginal = parseInt(el.getAttribute('data-original'));
  const isCorrect = selectedOriginal === correctOriginalIndex;

  allOptions.forEach(opt => {
    opt.classList.add('disabled');
    const orig = parseInt(opt.getAttribute('data-original'));
    if (orig === correctOriginalIndex) opt.classList.add('correct');
  });

  if (!isCorrect) {
    el.classList.add('wrong');
    el.classList.remove('correct');
  }

  if (isCorrect) score++;

  const feedback = document.getElementById('feedback');
  const q = questions[current];
  feedback.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
  feedback.textContent = (isCorrect ? '✓ Correct — ' : '✗ Not quite — ') + q.explanation;

  document.getElementById('score-live').textContent = `Score: ${score}`;
  document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
  if (!answered) return;
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-area').style.display = 'none';
  const panel = document.getElementById('results-panel');
  panel.style.display = 'block';

  const total = questions.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('final-score').textContent = `${pct}%`;
  document.getElementById('total-q').textContent = total;
  document.getElementById('correct-count').textContent = score;
  document.getElementById('wrong-count').textContent = total - score;

  let msg = '';
  if (pct === 100) msg = "Perfect score. You know this chapter cold.";
  else if (pct >= 80) msg = "Solid. Review the ones you missed and you're ready.";
  else if (pct >= 60) msg = "Getting there — a few gaps to patch before the exam.";
  else msg = "Worth another pass through the material before you quiz again.";

  document.getElementById('result-message').textContent = msg;
  document.getElementById('progress-bar').style.width = '100%';
}

restartQuiz();
</script>
